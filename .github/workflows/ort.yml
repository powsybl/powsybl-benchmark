name: Open Source Compliance

on:
  push:
    branches:
      - 'main'
      - 'release-v**'
      - 'full-sonar-analysis-**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  ort:
    name: License and SBOM checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up local ORT configuration
        shell: bash
        run: |
          mkdir -p "$HOME/.ort/config"
          cp -R ort/. "$HOME/.ort/config/"

      - name: Run ORT
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1.2.0
        with:
          # Pin the ORT version so that a new ORT release cannot break the configuration files overnight.
          # Replace <version> with the release the ort/ files were validated against
          # (see https://github.com/oss-review-toolkit/ort/pkgs/container/ort).
          # image: 'ghcr.io/oss-review-toolkit/ort:<version>'
          run: >
            cache-dependencies,
            cache-scan-results,
            analyzer,
            scanner,
            advisor,
            evaluator,
            reporter,
            upload-results
          # Scan only the PowSyBl source code with ScanCode; dependencies are checked through their
          # declared (Maven POM) licenses. Scanning every dependency jar would take hours.
          ort-cli-scan-args: '--package-types PROJECT'
          # Name the SBOM after the release tag instead of the commit short SHA.
          sw-version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          fail-on: violations
          report-formats: 'CycloneDx,SpdxDocument,WebApp'
          image: 'ghcr.io/oss-review-toolkit/ort:97.3.0'

      - name: Publish ORT findings
        if:  >-
          always() 
          && steps.ort.outputs.results-evaluator-path != ''
        env:
          EVALUATOR_RESULT: ${{ steps.ort.outputs.results-evaluator-path }}
        shell: python
        run: |
          import json
          import os

          path = os.environ["EVALUATOR_RESULT"]

          with open(path, encoding="utf-8") as f:
              result = json.load(f)

          violations = result.get("evaluator", {}).get("violations", [])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a",
                    encoding="utf-8") as summary:
              summary.write("# ORT compliance results\n\n")

              if not violations:
                  summary.write("No policy violations found.\n")
              else:
                  summary.write(
                      f"**{len(violations)} finding(s)** detected.\n\n"
                  )

                  for v in violations:
                      severity = v.get("severity", "UNKNOWN")
                      rule = v.get("rule", "Unknown rule")
                      package = v.get("pkg") or "Repository"
                      message = v.get("message", "")
                      fix = v.get("how_to_fix") or "No suggestion available."

                      summary.write(
                          f"### {severity}: {rule}\n\n"
                          f"- **Component:** `{package}`\n"
                          f"- **Message:** {message}\n\n"
                          f"**How to fix:**\n\n{fix}\n\n---\n\n"
                      )

                      # Also expose findings in the GitHub Checks UI.
                      level = {
                          "ERROR": "error",
                          "WARNING": "warning",
                          "HINT": "notice",
                      }.get(severity, "notice")

                      def escape(value):
                          return (str(value)
                              .replace("%", "%25")
                              .replace("\r", "%0D")
                              .replace("\n", "%0A")
                              .replace(":", "%3A")
                              .replace(",", "%2C"))

                      print(
                          f"::{level} title={escape(rule)}::"
                          f"{escape(package + ': ' + message)}"
                      )
