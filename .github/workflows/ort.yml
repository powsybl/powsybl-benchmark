name: Open Source Compliance

on:
  push:
    branches:
      - 'main'
      - 'release-v**'
      - 'full-sonar-analysis-**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    paths:
      - '**/pom.xml'
      - 'ort/**'
      - '.github/workflows/ort.yml'
  workflow_dispatch:

permissions: {}

jobs:
  ort:
    name: License and SBOM checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write   # needed to create/update/delete the PR comment

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up local ORT configuration
        shell: bash
        run: |
          mkdir -p "$HOME/.ort/config"
          cp -R ort/. "$HOME/.ort/config/"

      - name: Run ORT
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1.2.0
        with:
          # Pin the ORT version so that a new ORT release cannot break the configuration files overnight.
          # Replace <version> with the release the ort/ files were validated against
          # (see https://github.com/oss-review-toolkit/ort/pkgs/container/ort).
          # image: 'ghcr.io/oss-review-toolkit/ort:<version>'
          run: >
            cache-dependencies,
            cache-scan-results,
            analyzer,
            scanner,
            advisor,
            evaluator,
            reporter,
            upload-results
          # Scan only the PowSyBl source code with ScanCode; dependencies are checked through their
          # declared (Maven POM) licenses. Scanning every dependency jar would take hours.
          ort-cli-scan-args: '--package-types PROJECT'
          # Name the SBOM after the release tag instead of the commit short SHA.
          sw-version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          fail-on: violations
          report-formats: 'CycloneDx,SpdxDocument,WebApp'
          image: 'ghcr.io/oss-review-toolkit/ort:97.3.0'


      - name: Upload CycloneDX SBOM for PR review
        id: ort-cyclonedx
        if: always() && steps.ort.outputs.results-sbom-cyclonedx-json-path != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: ort-cyclonedx-${{ github.run_id }}
          path: ${{ steps.ort.outputs.results-sbom-cyclonedx-json-path }}
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
          archive: 'false'

      - name: Upload SPDX SBOM for PR review
        id: ort-spdx
        if: always() && steps.ort.outputs.results-sbom-spdx-json-path != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: ort-spdx-${{ github.run_id }}
          path: ${{ steps.ort.outputs.results-sbom-spdx-json-path }}
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
          archive: 'false'

      - name: Upload HTML report for PR review
        id: ort-html
        if: always() && steps.ort.outputs.results-web-app-path != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: ort-html-${{ github.run_id }}
          path: ${{ steps.ort.outputs.results-web-app-path }}
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
          archive: 'false'

      - name: Create the ORT PR comment
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          EVALUATOR_RESULT: ${{ steps.ort.outputs.results-evaluator-path }}
          ORT_OUTCOME: ${{ steps.ort.outcome }}
          CYCLONEDX_URL: ${{ steps.ort-cyclonedx.outputs.artifact-url }}
          SPDX_URL: ${{ steps.ort-spdx.outputs.artifact-url }}
          HTML_URL: ${{ steps.ort-html.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- ort-compliance-check -->';
            const resultPath = process.env.EVALUATOR_RESULT;

            const body = [
              marker,
              '### 📦 Open Source Compliance Check',
              '',
            ];

            if (resultPath && fs.existsSync(resultPath)) {
              const result = JSON.parse(
                fs.readFileSync(resultPath, 'utf8')
              );

              const violations = result.evaluator?.violations || [];

              if (violations.length === 0) {
                body.push(
                  '✅ **No policy violations detected.**',
                  '',
                  'All dependencies passed the configured ORT policy checks.',
                  ''
                );
              } else {
                body.push(
                  `⚠️ **${violations.length} finding(s) detected.**`,
                  ''
                );

                for (const v of violations) {
                  const icons = {
                    ERROR: '🔴',
                    WARNING: '⚠️',
                    HINT: 'ℹ️',
                  };

                  body.push(
                    `#### ${icons[v.severity] || '•'} ${v.rule} (${v.severity})`,
                    '',
                    `**Component:** \`${v.pkg || 'Repository'}\``,
                    '',
                    v.message || '',
                    '',
                    '**How to fix:**',
                    '',
                    v.how_to_fix || 'No remediation suggestion available.',
                    '',
                    '---',
                    ''
                  );
                }
              }
            } else {
              body.push(
                '❌ **ORT analysis did not produce an evaluation result.**',
                '',
                `ORT step outcome: \`${process.env.ORT_OUTCOME}\`.`,
                '',
                'Please consult the workflow logs for details.',
                ''
              );
            }

            body.push('### 📄 Detailed reports', '');

            const reportLinks = [
              ['CycloneDX SBOM', process.env.CYCLONEDX_URL],
              ['SPDX SBOM', process.env.SPDX_URL],
              ['HTML report', process.env.HTML_URL],
            ].filter(([, url]) => url);

            if (reportLinks.length > 0) {
              body.push(...reportLinks.map(([label, url]) => `- [${label}](${url})`), '');
            } else {
              body.push(
                'Reports artifact is not available for this run.',
                ''
              );
            }

            body.push(
              `[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              `_Last updated for commit ${context.payload.pull_request.head.sha.substring(0, 7)}._`
            );

            const commentBody = body.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const existing = comments.filter(
              c => c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            for (const comment of existing) {
              await github.rest.issues.deleteComment({
                owner, repo, comment_id: comment.id,
              });
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: commentBody,
            });
