---
# License classifications used by the PowSyBl ORT policy rules (evaluator.rules.kts)
# and by the reporter templates.
#
# PowSyBl projects are distributed under MPL-2.0 and their dependencies are consumed as separate
# Maven artifacts (dynamic linking from a licensing point of view). The policy categories are:
#
#   permissive       Allowed everywhere.
#   public-domain    Allowed everywhere.
#   weak-copyleft    File/library-level copyleft (MPL, EPL, LGPL, CDDL, GPL + Classpath exception...).
#                    Allowed as unmodified dependencies; flagged when found inside PowSyBl source code
#                    (copied third-party files) or when statically linked.
#   strong-copyleft  GPL/AGPL family and share-alike content licenses. Not allowed in dependencies
#                    nor in the source code (unless an alternative license can be chosen).
#   review-required  Non OSI-approved or restrictive licenses (e.g. "JSON": "shall be used for Good,
#                    not Evil"). Must be reviewed case by case.
#
# Licenses that are not listed here trigger the UNHANDLED_LICENSE rule: add them here (with a legal
# review) rather than in a project's .ort.yml.
#
# Deprecated SPDX ids (GPL-2.0, GPL-2.0+, LGPL-2.1...) are normalized by ORT to their -only/-or-later
# equivalents, so only the current ids are listed.
categories:
  - name: "permissive"
    description: "Licenses with permissive obligations."
  - name: "public-domain"
    description: "Public domain dedications."
  - name: "weak-copyleft"
    description: "File or library level copyleft. Allowed for dynamically linked, unmodified dependencies."
  - name: "strong-copyleft"
    description: "Copyleft applying to the whole combined work. Not allowed in PowSyBl distributions."
  - name: "review-required"
    description: "Licenses requiring a case-by-case review by the PowSyBl TSC."
  - name: "include-in-notice-file"
    description: >-
      This category is checked by templates used by the ORT report generator. The licenses associated with this
      category are included into NOTICE files.
  - name: "include-source-code-offer-in-notice-file"
    description: >-
      A marker category that indicates that the licenses assigned to it require that the source code of the packages
      needs to be provided.

categorizations:
